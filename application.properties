spring.application.name=car

# ---- MySQL (override with environment variables if needed) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/car_rental?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- JWT ----
# Base64 secret (>= 256 bit). Set JWT_SECRET in production, the default is for local development only.
# app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ---- Demo data (creates an admin account + sample cars when the tables are empty) ----
# Set app.seed.enabled=false once you have your own data.
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-email=${ADMIN_EMAIL:admin@carrental.com}
app.seed.admin-password=${ADMIN_PASSWORD:Admin@12345}
